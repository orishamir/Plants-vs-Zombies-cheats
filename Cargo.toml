[package]
name = "pvz_cheats"
version = "0.1.1"
edition = "2024"
default-run = "gui"

[lints.rust]
unfulfilled_lint_expectations = "deny"

[lib]
name = "pvz_sdk"

[[bin]]
name = "gui"

[[bin]]
name = "testing"

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
] }
env_logger = "0.11.11"
proc_mem = "0.1.6"
num_enum = "0.7.6"
eframe = { version = "0.36.2" }
egui = "0.36.2"
thiserror = "2.0.20"
log = "0.4.34"
anyhow = "1.0.104"
strum = { version = "0.28.0", features = ["derive"] }
