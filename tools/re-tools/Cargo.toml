[package]
name = "re-tools"
version = "0.1.0"
edition = "2024"
description = "Reverse-engineering helpers for finding cheat patches in GameAssembly.dll"
publish = false

[dependencies]
pvz_cheats = { path = "../.." }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
goblin = { version = "0.10.7", default-features = false, features = ["std", "pe64"] }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "intel"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
pdb = "0.8.0"
msvc-demangler = "0.11.0"
ureq = "3.4.2"
