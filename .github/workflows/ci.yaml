name: CI Pipeline
on: [workflow_dispatch]
jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: nightly
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Test
        run: cargo test

  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: nightly
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Build Release
        run: cargo build --release --bin gui

      - name: Upload Built Artifacts (.exe)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: replanted_cheats.exe
          path: target/release/gui.exe
